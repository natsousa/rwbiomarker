name: render-report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Avoid concurrent Pages deploys stepping on each other
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::quarto
            any::survminer
            any::gtsummary
            any::ggplot2
            any::knitr
            any::rmarkdown
            any::gridExtra

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install rwbiomarker package
        run: Rscript -e 'devtools::install(".", upgrade = FALSE)'

      - name: Run unit tests
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'

      - name: Render Quarto report
        run: |
          mkdir -p docs
          cd analysis
          quarto render report.qmd --output-dir ../docs
          cd ..
          if [ -f docs/report.html ]; then
            mv docs/report.html docs/index.html
          fi
          # Prevent GitHub Pages (Jekyll) from ignoring files/folders starting with "_"
          touch docs/.nojekyll

      - name: Commit rendered docs
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/.nojekyll docs/index.html docs/report_files docs/report.html || true
          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub Pages docs from workflow [skip ci]"
            git push origin HEAD:main
          else
            echo "No docs changes to commit"
          fi

      - name: Upload rendered report
        uses: actions/upload-artifact@v4
        with:
          name: rwbiomarker-report
          path: docs/index.html

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4