name: render-report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::quarto
            any::survminer
            any::gtsummary
            any::ggplot2
            any::knitr
            any::rmarkdown
            any::gridExtra

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install rwbiomarker package
        run: Rscript -e 'devtools::install(".", upgrade = FALSE)'

      - name: Run unit tests
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'

      - name: Render Quarto report
        run: |
          mkdir -p docs
          cd analysis
          quarto render report.qmd --output-dir ../docs
          cd ..
          if [ -f docs/report.html ]; then
            mv docs/report.html docs/index.html
          fi

      - name: Commit rendered docs
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/report_files docs/report.html || true
          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub Pages docs from workflow [skip ci]"
            git push origin HEAD:main
          else
            echo "No docs changes to commit"
          fi

      - name: Upload rendered report
        uses: actions/upload-artifact@v4
        with:
          name: rwbiomarker-report
          path: docs/index.html
